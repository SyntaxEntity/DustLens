name: msrv

# MSRV 钉住（裁定 D-22）
#
# 目的：README 徽章与 Cargo.toml 声明的是 "Rust 1.94+"。
# 这个 workflow 在每次推送时用 1.94.0 真构建一次，让那句声明不会随依赖升级悄悄漂移。
#
# 为什么用 rustup 而不是 actions-rs / dtolnay 之类：
#   版本号显式写在文件里，不依赖第三方 action 的分支别名，供应链面更小。
#   ubuntu runner 预装 rustup，无需额外安装。
#
# 为什么加 tags（裁定 D-30①）：
#   只匹配 branches 时，**打 tag 不触发**，于是「发布的那个 commit 恰好没跑过 CI」。
#   v0.1.0 就是这样发出去的（见 AGENT-REPORT-DustLens-20261022-02 §9）。
#
# ⚠️ paths 对 tag 推送**不生效**（2026-10-22 实测，与 brief v19 §3.2 的说法相反）：
#   同一个 tag 指向「纯文档提交」（bd373ae，只改 AGENTS.md）时，本 workflow **照样触发**；
#   指向「改过本文件的提交」（21972a4）时也触发。两次运行的 event=push、head 都是 tag 名。
#   结论：tag 推送会忽略 paths 过滤，因此**任何 v* tag 都会跑一遍** ——
#   这正是我们要的效果（发布点必过 CI），不需要额外约束。
#   反过来说：如果哪天希望 tag 也受路径限制，本文件做不到，需要改用
#   `if: github.event_name == 'workflow_dispatch' || ...` 之类的 job 级条件。

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - '.github/workflows/msrv.yml'
  pull_request:
  workflow_dispatch:

env:
  MSRV: "1.94.0"

jobs:
  msrv:
    name: build at MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.MSRV }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          rustup default "$MSRV"
          rustc --version

      - name: cargo build (locked, 以 MSRV)
        run: cargo build --workspace --locked

      - name: cargo test (locked, 以 MSRV)
        run: cargo test --workspace --locked
