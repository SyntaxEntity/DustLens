name: msrv

# MSRV 钉住（裁定 D-22）
#
# 目的：README 徽章与 Cargo.toml 声明的是 "Rust 1.94+"。
# 这个 workflow 在每次推送时用 1.94.0 真构建一次，让那句声明不会随依赖升级悄悄漂移。
#
# 为什么用 rustup 而不是 actions-rs / dtolnay 之类：
#   版本号显式写在文件里，不依赖第三方 action 的分支别名，供应链面更小。
#   ubuntu runner 预装 rustup，无需额外安装。
#
# 为什么加 tags（裁定 D-30①）：
#   只匹配 branches 时，**打 tag 不触发**，于是「发布的那个 commit 恰好没跑过 CI」。
#   v0.1.0 就是这样发出去的（见 AGENT-REPORT-DustLens-20261022-02 §9）。
#
# ⚠️ 关于 paths 与 tag 的关系（待实测确认）：
#   brief v19 指出：`push` 下同时写 branches + tags + paths 时，paths 对 tag 推送**同样生效**。
#   若如此，则「只有文档变更的 commit」打 tag 不会触发本 workflow ——
#   发版 tag 应落在含 Cargo.toml / 代码变更的提交上。
#   本条以实测结论为准，确认后会更新此处措辞。

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - '.github/workflows/msrv.yml'
  pull_request:
  workflow_dispatch:

env:
  MSRV: "1.94.0"

jobs:
  msrv:
    name: build at MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.MSRV }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          rustup default "$MSRV"
          rustc --version

      - name: cargo build (locked, 以 MSRV)
        run: cargo build --workspace --locked

      - name: cargo test (locked, 以 MSRV)
        run: cargo test --workspace --locked
