[workspace]
resolver = "2"
members = ["crates/dustlens-core", "crates/dustlens-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/SyntaxEntity/DustLens"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
